name: HDK.io required policy

'on':
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  policy:
    name: HDK.io Policy
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - name: Check out candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify repository CI contract
        if: github.repository != 'hdk-io/.github'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          workflow_dir = Path(".github/workflows")
          workflows = sorted(
              path
              for pattern in ("*.yml", "*.yaml")
              for path in workflow_dir.glob(pattern)
              if path.is_file()
          )

          if not workflows:
              print("::error::No GitHub Actions workflows were found.")
              sys.exit(1)

          contract_workflow = None
          for path in workflows:
              lines = path.read_text(encoding="utf-8").splitlines()
              for index, line in enumerate(lines):
                  if not re.fullmatch(r"  repository-ci:\s*(?:#.*)?", line):
                      continue

                  has_name = False
                  for nested in lines[index + 1:]:
                      if re.fullmatch(r"  [A-Za-z0-9_-]+:\s*(?:#.*)?", nested):
                          break
                      if re.fullmatch(
                          r"    name:\s*['\"]?Repository CI['\"]?\s*(?:#.*)?",
                          nested,
                      ):
                          has_name = True
                          break

                  if has_name:
                      contract_workflow = path
                      break

              if contract_workflow is not None:
                  break

          if contract_workflow is None:
              print(
                  "::error::Expected a job with id 'repository-ci' and "
                  "name 'Repository CI'."
              )
              sys.exit(1)

          source = contract_workflow.read_text(encoding="utf-8")
          missing_events = [
              event
              for event in ("pull_request", "merge_group")
              if re.search(rf"(?m)^  {event}:\s*(?:#.*)?$", source) is None
          ]
          if missing_events:
              print(
                  "::error::Repository CI workflow is missing required event(s): "
                  + ", ".join(missing_events)
              )
              sys.exit(1)

          print(f"Repository CI contract: {contract_workflow}")
          PY

      # Keep the parser and scanner independent of candidate repository code.
      - name: Install pinned workflow parser
        shell: bash
        run: |
          python3 -I -m venv "$RUNNER_TEMP/hdk-policy-python"
          "$RUNNER_TEMP/hdk-policy-python/bin/python3" -I -m pip install --disable-pip-version-check --no-deps 'PyYAML==6.0.3'
          echo "$RUNNER_TEMP/hdk-policy-python/bin" >> "$GITHUB_PATH"

      - name: Test workflow dependency policy
        if: github.repository == 'hdk-io/.github'
        shell: bash
        run: python3 -I -m unittest discover -s tests -v

      - name: Verify workflow dependency pinning
        shell: bash
        run: |
          python3 -I - <<'PYTHON'
          from pathlib import Path
          import re
          import sys
          import yaml

          workflow_dir = Path(".github/workflows")
          failures = []

          def check_uses(container, location):
              if "uses" not in container:
                  return
              target = container["uses"]
              if not isinstance(target, str) or not target.strip():
                  failures.append(f"{location}: uses must be a nonempty string")
                  return
              target = target.strip()
              if target.startswith("./") or target.startswith("docker://"):
                  return
              if "@" not in target:
                  failures.append(f"{location}: action has no immutable ref: {target}")
              elif re.fullmatch(r"[0-9a-f]{40}", target.rsplit("@", 1)[1]) is None:
                  failures.append(
                      f"{location}: action must be pinned to a "
                      f"40-character commit SHA: {target}"
                  )

          for pattern in ("*.yml", "*.yaml"):
              for path in sorted(workflow_dir.glob(pattern)):
                  if not path.is_file():
                      continue
                  try:
                      workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
                      if not isinstance(workflow, dict) or not isinstance(workflow.get("jobs"), dict):
                          raise ValueError("workflow jobs must be a mapping")
                      for job_id, job in workflow["jobs"].items():
                          location = f"{path}:jobs.{job_id}"
                          if not isinstance(job, dict):
                              raise ValueError(f"{location} must be a mapping")
                          check_uses(job, location)
                          steps = job.get("steps", [])
                          if not isinstance(steps, list):
                              raise ValueError(f"{location}.steps must be a sequence")
                          for index, step in enumerate(steps):
                              if not isinstance(step, dict):
                                  raise ValueError(f"{location}.steps[{index}] must be a mapping")
                              check_uses(step, f"{location}.steps[{index}]")
                  except (OSError, ValueError, yaml.YAMLError) as exc:
                      failures.append(f"{path}: cannot inspect workflow: {exc}")

          if failures:
              for failure in failures:
                  print(f"::error::{failure}")
              sys.exit(1)

          print("All remote workflow dependencies are commit-SHA pinned.")
          PYTHON
